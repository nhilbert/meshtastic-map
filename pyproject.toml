[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshplay"
version = "0.1.0"
description = "Meshtastic playground: device scripts, coverage walks, map app and coverage simulation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-ITU-P1812.txt"]
authors = [{ name = "Norman Hilbert", email = "mail@nhilbert.de" }]
requires-python = ">=3.10"
dependencies = [
    "folium>=0.17",
    "meshtastic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Coverage simulation (meshplay.sim, scripts/sim_*.py)
sim = [
    "laspy[lazrs]>=2.5",
    "numpy>=1.26",
    "pyproj>=3.6",
    "scikit-image>=0.22",  # 3D view export (building outlines)
    "scipy>=1.11",
    "shapely>=2.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meshplay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: needs a Meshtastic device connected over USB (run with: pytest -m hardware)",
    "data: needs local data in data/sim (scene, sites.json, ITU validation files)",
]
addopts = "-m 'not hardware'"

[tool.ruff]
line-length = 100
target-version = "py310"
# Verbatim port of the ITU reference code, validated as is; keep its equation layout.
extend-exclude = ["src/meshplay/sim/p1812.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
